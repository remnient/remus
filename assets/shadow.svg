<polygon fill="white" stroke="none" points="-21.6,21.6 -21.6,-102.15 631.7,-102.15 631.7,21.6 -21.6,21.6" />

<g id="node1" class="node">
<title>readable</title>
<polygon fill="none" stroke="#333333" stroke-width="0.8" points="176.55,-80.55 0,-80.55 0,-7.2 176.55,-7.2 176.55,-80.55" />
<text xml:space="preserve" text-anchor="middle" x="88.27" y="-55.5" font-family="Liberation Serif" font-size="15.00" fill="#202020">Readable view</text>
<text xml:space="preserve" text-anchor="middle" x="88.27" y="-38.25" font-family="Liberation Serif" font-size="15.00" fill="#202020">original physical page</text>
<text xml:space="preserve" text-anchor="middle" x="88.27" y="-21" font-family="Liberation Serif" font-size="15.00" fill="#202020">read / write · no execute</text>
