<g id="node2" class="node">
<title>executable</title>
<polygon fill="none" stroke="#333333" stroke-width="0.8" points="610.1,-80.55 419.3,-80.55 419.3,-7.2 610.1,-7.2 610.1,-80.55" />
<text xml:space="preserve" text-anchor="middle" x="514.7" y="-55.5" font-family="Liberation Serif" font-size="15.00" fill="#202020">Executable view</text>
<text xml:space="preserve" text-anchor="middle" x="514.7" y="-38.25" font-family="Liberation Serif" font-size="15.00" fill="#202020">replacement physical page</text>
<text xml:space="preserve" text-anchor="middle" x="514.7" y="-21" font-family="Liberation Serif" font-size="15.00" fill="#202020">execute only</text>
</g>

<g id="edge1" class="edge">
<title>readable-&gt;executable</title>
<path fill="none" stroke="#285b62" stroke-width="0.8" d="M176.7,-43.88C244.97,-43.88 339.97,-43.88 411.7,-43.88" />
<polygon fill="#285b62" stroke="#285b62" stroke-width="0.8" points="411.3,-46.15 417.8,-43.88 411.3,-41.6 411.3,-46.15" />
<text xml:space="preserve" text-anchor="middle" x="297.93" y="-60.98" font-family="Liberation Serif" font-size="12.00" fill="#285b62">instruction-fetch fault</text>
<text xml:space="preserve" text-anchor="middle" x="297.93" y="-46.73" font-family="Liberation Serif" font-size="12.00" fill="#285b62">matching address space</text>
</g>

<g id="edge2" class="edge">
<title>executable-&gt;readable</title>
<path fill="none" stroke="#555555" stroke-width="0.8" d="M419.27,-16.17C400.24,-11.68 380.26,-7.73 361.3,-5.38 305.4,1.58 290.41,1.9 234.55,-5.38 218.02,-7.53 200.7,-11 184.01,-15.01" />
